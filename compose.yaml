services:

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_db}
      POSTGRES_USER: ${POSTGRES_USER:-financial_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financial_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financial_user} -d ${POSTGRES_DB:-financial_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financial_net

  # ── PHP-FPM (Symfony) ─────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      # Named volumes for vendor/ and var/ avoid Windows bind-mount overhead
      - app_vendor:/var/www/html/vendor
      - app_var:/var/www/html/var
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:-change_me}
      DATABASE_URL: ${DATABASE_URL:-postgresql://financial_user:financial_pass@db:5432/financial_db?serverVersion=16&charset=utf8}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-%kernel.project_dir%/config/jwt/private.pem}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-%kernel.project_dir%/config/jwt/public.pem}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-change_me_jwt_passphrase}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-'^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - financial_net

  # ── Nginx (serves Symfony via PHP-FPM) ────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - financial_net

  # ── React / Vite frontend dev server ──────────────────────────────────────
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://localhost:${APP_PORT:-8080}
    depends_on:
      - nginx
    networks:
      - financial_net

volumes:
  postgres_data:
  app_vendor:
  app_var:

networks:
  financial_net:
    driver: bridge
