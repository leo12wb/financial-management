[PHP]
; Error handling
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Performance
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; validate_timestamps=0: never stat files for changes (prod mode — restart FPM to clear cache)
; This eliminates the Windows Docker bind-mount stat() overhead on every request
opcache.validate_timestamps = 0
opcache.fast_shutdown = 1
opcache.enable_file_override = 1

; Uploads (CSV import limit)
upload_max_filesize = 10M
post_max_size = 10M
max_execution_time = 120
memory_limit = 256M

; Timezone
date.timezone = UTC
